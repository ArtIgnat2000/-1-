<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Питание 2 «В»</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#4c6fff">
    <meta name="description" content="Расписание питания 2 «В» класса — в стиле iOS 26">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg" aria-hidden="true">
        <div class="blob b1"></div>
        <div class="blob b2"></div>
        <div class="blob b3"></div>
        <div class="blob b4"></div>
        <div class="blob b5"></div>
    </div>

    <main class="app">
        <header class="hero">
            <div class="hero-icon food" aria-hidden="true">🍽️</div>
            <div>
                <h1>Питание</h1>
                <div class="subtitle">2 «В» класс</div>
                <div class="hero-date" id="heroDate"></div>
            </div>
        </header>

        <div class="segmented glass" role="tablist" aria-label="Приём пищи">
            <div class="seg-indicator" aria-hidden="true"></div>
            <button class="seg" type="button" role="tab" data-tab="all">Все</button>
            <button class="seg" type="button" role="tab" data-tab="breakfast">Завтрак</button>
            <button class="seg" type="button" role="tab" data-tab="lunch">Обед</button>
            <button class="seg" type="button" role="tab" data-tab="snack">Полдник</button>
        </div>

        <section class="day-card glass" aria-label="Питание 2 «В»">
            <div class="day-head">
                <h2 id="tabTitle">Все приёмы пищи</h2>
                <span id="nowChip" class="today-chip">Сейчас</span>
            </div>
            <div id="meals"></div>
        </section>

        <section class="rating-card glass" aria-label="Дополнительно">
            <h3>Дополнительно</h3>
            <div class="rate-row"><span class="rate-badge blue">12–14</span><span class="card-text">Раздача со свободным выбором блюд</span></div>
            <div class="rate-row"><span class="rate-badge green">09–16</span><span class="card-text">Время работы кафе</span></div>
            <div class="rate-row"><span class="rate-badge yellow">07 / 16</span><span class="card-text">Кварцевание: 07:00–07:45, 16:15–17:30</span></div>
        </section>

        <footer>© 2026 · Питание 2 «В» класса</footer>
    </main>

    <nav class="dock glass" aria-label="Разделы">
        <a href="index.htm" class="dock-btn"><span class="dock-ico" aria-hidden="true">📚</span><span>Уроки</span></a>
        <a href="meal.htm" class="dock-btn active" aria-current="page"><span class="dock-ico" aria-hidden="true">🍽️</span><span>Еда</span></a>
        <a href="holidays.htm" class="dock-btn"><span class="dock-ico" aria-hidden="true">🌴</span><span>Каникулы</span></a>
        <a href="https://artignat2000.github.io/DopSchedule/" class="dock-btn"><span class="dock-ico" aria-hidden="true">💡</span><span>Доп</span></a>
    </nav>

    <script src="script.js"></script>
</body>
</html>
